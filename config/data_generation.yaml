# ──────────────────────────────────────────────────────────────────────
# CWFS Training Data Generation Configuration
# ──────────────────────────────────────────────────────────────────────

optics:
  OD: 0.76               # outer aperture diameter, metres
  ID: 0.152              # inner aperture diameter (central obscuration), metres
  focal_ratio: 3.33      # f-number (focal length = OD * focal_ratio)

  # Modular Defocus Specification:
  # Physical axial offsets of camera measurement planes from nominal focus, in metres.
  # For each distance d_k:
  #   Channel 2k   : Intra-focal (+d_k)
  #   Channel 2k+1 : Extra-focal (-d_k, rotated 180° + dtheta)
  # If include_focal is true, the nominal focal plane (dz=0) is appended as Channel 2K.
  defocus_distances_m:
    - 0.369e-3
    - 0.738e-3
    - 1.107e-3
    - 1.476e-3
    - 1.845e-3
  include_focal: true

  # Legacy aliases for backward compatibility
  delta_z: 0.369e-3

  # Focal plane sampling.
  # q   : pixels per lambda/D at the reference wavelength.
  # num_airy : half-width of focal grid in lambda/D units.
  #            num_airy=170 yields 1028x1028 subpixels, covering the 1024x1024
  #            detector window and allowing zero-copy slicing without zero-padding.
  q: 3.025
  num_airy: 170

  # Sub-pixel oversampling factor. The focal grid is sampled at
  # (img_size * pixel_oversample)^2 and binned to img_size^2 after
  # accumulation, ensuring Nyquist sampling of lambda/D is maintained.
  pixel_oversample: 4

  # Pupil grid resolution (samples across diameter).
  # Np=512 satisfies Nyquist sampling up to dz=1.885 mm at 380 nm.
  pupil_samples: 512

  # Reference wavelength used to anchor the lambda/D grid and as the
  # base wavelength for atmospheric OPD extraction.
  wavelength_ref: 550.0e-9   # metres

wavelengths:
  # Polychromatic bandpass.
  # Sampling is uniform in wavenumber (1/lambda) to give equal photon-energy spacing.
  lambda_min: 380.0e-9   # metres
  lambda_max: 700.0e-9   # metres
  n_wavelengths: 11

  # Spectral weights applied when summing monochromatic PSFs.
  # 'flat'  : uniform weights (equal energy per wavenumber interval)
  # 'solar' : approximate G-star spectrum (not yet implemented, falls back to flat)
  weights: flat

zernike:
  # Number of Zernike modes in the mirror phase screen (Noll ordering).
  # Modes Z2..Z(2+n_modes-1) are used. n_modes=36 covers Z2–Z37 (or Z1–Z36 excluding tip/tilt/piston).
  # Must match the n_outputs in the model configs.
  n_modes: 36

  # RMS amplitude of each drawn coefficient, metres OPD.
  amplitude_rms: 125.0e-9

  # Coefficient sampling distribution: 'gaussian' or 'uniform'
  distribution: gaussian

  # Per-mode amplitude normalization applied to the scalar amplitude_rms.
  #   'none'         - all modes share the same amplitude_rms (default)
  #   'radial_order' - amplitude for mode with Noll radial order n = amplitude_rms / n
  amplitude_normalization: 'radial_order'

  # Optional per-mode RMS override list (length must equal n_modes).
  per_mode_rms_nm: null

atmosphere:
  enabled: true

  # Use hcipy's Las Campanas (LCO) multi-layer turbulence profile.
  # If false, a single-layer Kolmogorov screen is used instead.
  use_las_campanas: true

  # Fried parameter at 500 nm (metres) when tolerancing is disabled:
  r0_500nm: 0.10
  L0: 25.0               # outer scale for Las Campanas profile, metres

  # Single-layer fallback (used only when use_las_campanas: false)
  single_layer:
    Cn2: 1.0e-14
    L0: 25.0             # outer scale, metres
    wind_speed: 10.0     # m/s
    wind_direction: 0.0  # radians

tolerancing:
  # Physical optomechanical and seeing variations sampled per example
  enabled: false

  # Absolute axial positioning uncertainty per defocus plane, in metres.
  # Uniform distribution in [-dz_uncertainty_m, +dz_uncertainty_m] (e.g. ±40 um)
  dz_uncertainty_m: 40.0e-6

  # Camera rotational clocking error around nominal 180° Roddier flip
  dtheta:
    distribution: "uniform"
    max_deg: 2.0            # ±2.0 degrees -> [-2.0, +2.0] deg

  # Seeing conditions: Fried parameter r0 at 500 nm
  seeing:
    distribution: "uniform"
    r0_min: 0.08            # metres (8 cm)
    r0_max: 0.16            # metres (16 cm)

simulation:
  n_examples: 10       # default examples per run/shard (overridden by CLI or array task)
  n_channels: 11         # 11 channels: 5 intra/extra pairs + focal plane [0.369, 0.738, 1.107, 1.476, 1.845]mm
  t_frames: 8            # frames per sequence pair
  frame_rate: 50.0       # Hz

  # Final PSF image size written to HDF5 [img_size x img_size].
  img_size: 256

  # HDF5 chunk shape along the N axis (1 enables sub-millisecond per-example streaming).
  hdf5_chunk_size: 1

  # Save debug/verification PNG plot at conclusion of each example (overwritten each example)
  output_tmp_plots: false

  random_seed: 42

storage:
  # Execution staging directory: Node-local NVMe/SSD (/tmp on UA HPC nodes).
  # Set to null or "" to bypass staging and write directly to target_root.
  staging_dir: "/tmp"

  # Persistent destination root: defaults to /rental/cbender.
  # Modular: override via CLI with --storage.target_root=/groups/cbender or /xdisk/cbender
  target_root: "/rental/cbender"

  # Relative subfolder under target_root
  sub_dir: "cwfs_shards"

  # Automatically purge local shard from staging_dir after successful copy to target_root
  cleanup_staging: true

hpc:
  mode: "array"                 # "array" or "single"
  partition: "standard"
  account: "cbender"
  qos: "user_default"
  time_limit: "01:30:00"
  cpus_per_task: 4
  mem_gb: 16
  n_tasks: 40                   # 40 tasks x 1,000 examples = 40,000 total
  examples_per_task: 1000

output:
  path: data/cwfs_synthetic.h5
  # Unit metadata stored as HDF5 attribute on the 'labels' dataset.
  label_units: metres_opd

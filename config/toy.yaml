model:
  type: toy
  input_mode: r_stack
  img_size: 256
  patch_size: 16
  embed_dim: 128
  dropout: 0.1
  n_outputs: 36

data:
  hdf5_path: null         # override on the command line: --hdf5_path /path/to/data.h5
  split_ratios: [0.80, 0.10, 0.10]
  split_seed: 42
  batch_size: 16         
  num_workers: 4
  augment: false
  return_stacks: true

training:
  epochs: 50
  lr: 3.0e-4
  weight_decay: 1.0e-2
  warmup_steps: 500
  grad_clip: 1.0
  amp: true
  compile_mode: reduce-overhead  # 'reduce-overhead' (fast), 'default' (balanced), false/null to disable

logging:
  checkpoint_dir: checkpoints/toy
  log_interval: 2
  save_top_k: 3

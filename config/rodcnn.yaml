model:
  type: rodcnn
  base_ch: 48             # stem channels; stages scale to 64→128→256→256
  stage_blocks: 2         # BasicBlocks per ResNet stage
  stem_stride: 2          # Stride 2 in stem: 256x256 -> 128x128 (4x FLOP reduction)
  dropout: 0.0
  trained_modes: null     # null or omitted defaults to all modes minus piston/tip/tilt (Z4–Z36)
  k_pairs_train: 8       # subsample K=8 pairs during training (8x FLOPs speedup); all 64 in eval

data:
  hdf5_path: data/cwfs_consolidated_chunk1.h5
  split_ratios: [0.80, 0.10, 0.10]
  split_seed: 42
  batch_size: 8           # mini-batch size (4 examples x 16 pairs = 64 pairs on GPU per pass)
  num_workers: 4
  preload: false          # chunk=1 enables sub-millisecond on-the-fly streaming from disk (<200MB RAM)
  augment: true
  prefetch_factor: 4
  z_score_labels: true   # Enable Z-score normalization of labels (mean=0, std=1); false trains on raw physical units
  train_sample_count: null   # Subsample training examples (integer count, e.g. 5000); null uses full split
  train_sample_ratio: null   # Subsample training examples by ratio (0.0 < ratio <= 1.0); null uses full split
  amplitude_range_nm: null   # Filter dataset by RMS WFE range [min_nm, max_nm], e.g. [100.0, 150.0]; null uses all
  noise:
    enabled: false           # Inject on-the-fly detector noise (Poisson shot noise + Gaussian read noise)
    type: "poisson"          # "poisson", "gaussian", or "poisson_gaussian"
    photons_per_frame: 1.0e6 # Total incident photons per frame (e.g. 1e4 to 1e7); inf or null for clean
    read_noise_e: 0.0        # Detector readout noise in RMS electrons (e.g. 2.0 e-)
    seed: 42                 # Base seed for deterministic validation & test set noise

training:
  epochs: 30
  lr: 1.0e-3
  weight_decay: 3.0e-2
  betas: [0.9, 0.999]     # AdamW momentum (beta1) and second-moment decay (beta2) coefficients
  warmup_steps: 500
  grad_clip: 1.0
  amp: true
  accumulate_every: 1     # 1 step per batch of 4 examples
  compile_mode: default
  validate: true         # Set false to skip validation epochs; true to re-enable
  val_sample_ratio: 0.5  # Evaluate 80% of validation examples to lower validation time (0.0 < ratio <= 1.0)
  log_loss: false        # Return loss function as ln(MSE); false returns standard MSE
  loss_type: "mse"       # Options: "mse", "log_mse", "wfe_rms" (default: "mse")
  swa: false             # Stochastic Weight Averaging in tail epochs (default: false)
  swa_tail_epochs: 5     # Number of tail epochs to average into SWA model

  # Learning rate scheduler configuration
  scheduler:
    type: "cosine"         # Options: "constant", "cosine", "cosine_tail", "plateau"
    min_lr: 1.0e-6         # Minimum LR floor for cosine decay, cosine_tail plateau, or plateau
    patience: 2            # Epochs without validation improvement before decay (plateau only)
    factor: 0.5            # Multiplicative decay factor (plateau only)
    # Cosine with Extended Plateau Tail options (active when type: "cosine_tail"):
    tail_epochs: null      # Number of tail epochs held at min_lr plateau (e.g. 5 or 10; null uses tail_ratio)
    tail_ratio: 0.20       # Fraction of post-warmup training spent in plateau tail (default: 0.20 = 20%)

evaluation:
  tta: false             # Enable Test-Time Augmentation using D4 dihedral group (default: false)

logging:
  checkpoint_dir: checkpoints/rodcnn
  log_interval: 1000

# Optional multi-seed ensemble training & evaluation:
# - If omitted or null -> single run with seed=42
# - If integer N       -> runs N seeds [42, 276, ...]
# - If list of ints    -> runs specified seeds (e.g. [42, 276, 117])
# - mode               -> 'average' (average output Zernikes on test set) or 'best' (select lowest val WFE model)
ensemble:
  seeds: 3
  mode: average

# RMS Amplitude Range Experiment Sweep (Orban de Xivry et al. 2021 Fig 6)
name: "amplitude_range_sweep"
description: "Wavefront error RMS amplitude range sweep evaluating models trained on Low [100, 150] nm, Mid [150, 200] nm, High [200, 260] nm, and Full baseline with cosine annealing, SWA, and TTA (2 seeds)"

# Base configuration to inherit from
base_config: "config/rodcnn.yaml"

# Output root directory for this experiment suite
output_root: "experiments/results/amplitude_range_sweep"

# Target WFE threshold in nanometers for evaluating convergence velocity
target_wfe_nm: 45.0

# Slurm cluster parameters (defaults for UA HPC Puma / cbender allocation)
slurm:
  account: "cbender"
  partition: "gpu_high_priority"
  qos: "user_qos_cbender"
  cpus_per_task: 4
  gres: "gpu:nvidia_a100_80gb_pcie_3g.40gb"

# Global overrides applied to all trials in this sweep
common_overrides:
  training.epochs: 30
  training.lr: 1.0e-3
  training.weight_decay: 0.03
  training.betas: [0.9, 0.999]
  model.dropout: 0.0
  training.warmup_steps: 500
  training.scheduler.type: "cosine"
  training.scheduler.min_lr: 1.0e-6
  training.swa: true
  training.swa_tail_epochs: 5
  logging.sparse_record: true
  logging.save_top_k: 2
  evaluation.tta: true
  ensemble.seeds: 2
  ensemble.mode: average

# Explicit trials spanning the 3 well-populated amplitude tiers and full baseline
trials:
  - name: "low_100_150nm"
    overrides:
      data.amplitude_range_nm: [100.0, 150.0]
  - name: "mid_150_200nm"
    overrides:
      data.amplitude_range_nm: [150.0, 200.0]
  - name: "high_200_260nm"
    overrides:
      data.amplitude_range_nm: [200.0, 260.0]
  - name: "full_baseline"
    overrides:
      data.amplitude_range_nm: null

